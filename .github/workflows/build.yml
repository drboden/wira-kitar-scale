name: Build app

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'anchoring/**'
      - '.github/workflows/anchoring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the app (debug APK)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename the app file
        run: cp app/build/outputs/apk/debug/app-debug.apk WiraKitarScale.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WiraKitarScale-apk
          path: WiraKitarScale.apk

      - name: Save the app file to the "apk" branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk-out
          git rm -rf --cached . > /dev/null
          git add -f WiraKitarScale.apk
          git commit -m "App build from ${GITHUB_SHA::7}"
          git push -f origin apk-out:apk
